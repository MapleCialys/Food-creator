name: Android

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk FoodCreator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: food-creator-debug-apk
          path: FoodCreator.apk
      # Nom de fichier fixe : https://github.com/<repo>/releases/latest/download/FoodCreator.apk
      - if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Food Creator (build ${{ github.run_number }})
          body: "APK de test compilé depuis ${{ github.ref_name }} (${{ github.sha }})."
          files: FoodCreator.apk
          make_latest: true
